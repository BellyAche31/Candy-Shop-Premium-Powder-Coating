<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Style A coated in Hi Gloss White">
  <defs>
    <radialGradient id="grad_Style_A_coated_in_Hi_Gloss_White" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#808080"/>
    </radialGradient>
    <radialGradient id="bg_glow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="100%" stop-color="#161616"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg_glow)"/>

  <!-- tire -->
  <circle cx="240" cy="180" r="152" fill="#0a0a0a"/>
  <circle cx="240" cy="180" r="152" fill="none" stroke="#2c2c2c" stroke-width="2"/>

  <!-- rim -->
  <circle cx="240" cy="180" r="118" fill="url(#grad_Style_A_coated_in_Hi_Gloss_White)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <path d="M240,180 L246,72 A6,6 0 0 0 234,72 Z" fill="#0d0d0d" opacity="0.85" transform="rotate(36 240 180)"/><path d="M240,180 L246,72 A6,6 0 0 0 234,72 Z" fill="#0d0d0d" opacity="0.85" transform="rotate(108 240 180)"/><path d="M240,180 L246,72 A6,6 0 0 0 234,72 Z" fill="#0d0d0d" opacity="0.85" transform="rotate(180 240 180)"/><path d="M240,180 L246,72 A6,6 0 0 0 234,72 Z" fill="#0d0d0d" opacity="0.85" transform="rotate(252 240 180)"/><path d="M240,180 L246,72 A6,6 0 0 0 234,72 Z" fill="#0d0d0d" opacity="0.85" transform="rotate(324 240 180)"/>

  <!-- inner rim ring -->
  <circle cx="240" cy="180" r="70" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="3"/>
  <circle cx="240" cy="180" r="70" fill="#808080" opacity="0.5"/>

  <!-- hub -->
  <circle cx="240" cy="180" r="30" fill="#141414" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="240" cy="180" r="10" fill="#050505"/>

  <!-- gloss highlight -->
  <ellipse cx="195" cy="120" rx="55" ry="24" fill="#ffffff" opacity="0.16" transform="rotate(-25 195 120)"/>
</svg>
